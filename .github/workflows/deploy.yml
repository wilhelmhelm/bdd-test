
name: Deploy both versions

on:
  push:
    branches:
      - main
      - separate-assets
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: source/main

      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: separate-assets
          path: source/preview

      - name: Build website
        run: |
          mkdir -p _site/preview
          rsync -av --exclude='.git' --exclude='.github' source/main/ _site/
          rsync -av --exclude='.git' --exclude='.github' source/preview/ _site/preview/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
